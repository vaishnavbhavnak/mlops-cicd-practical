
name: GitHub Secrets Demo

on:
  workflow_dispatch: 

jobs:
  verify-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret configuration
        env:
          DEMO_TOKEN: ${{secrets.DEMO_TOKEN}}
        run: |
          if [ -z "$DEMO_TOKEN"]; then 
            echo "Secrest is missing"
            exit 1
          fi 
          echo "Secret is configured successfully"

     